<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Matte Obsidian Slate Plate -->
  <rect width="500" height="500" rx="80" fill="#0f1113" />
  <rect width="494" height="494" x="3" y="3" rx="77" fill="none" stroke="#27272a" stroke-width="2" />

  <!-- Tactical Corner Pinstripes -->
  <line x1="45" y1="45" x2="115" y2="45" stroke="#6b7f42" stroke-width="3" stroke-linecap="round" />
  <line x1="45" y1="45" x2="45" y2="115" stroke="#6b7f42" stroke-width="3" stroke-linecap="round" />
  <line x1="455" y1="455" x2="385" y2="455" stroke="#6b7f42" stroke-width="3" stroke-linecap="round" />
  <line x1="455" y1="455" x2="455" y2="385" stroke="#6b7f42" stroke-width="3" stroke-linecap="round" />

  <!-- Unicorn with 'Y' Integrated Body (Matte Finish) -->
  <g transform="translate(10, -5)" filter="url(#softShadow)">
    <!-- 'Y' Stem & Body (Tactical Olive Drab - Matte) -->
    <!-- Left Arm & Hindquarters -->
    <polygon points="170,205 215,205 240,265 195,265" fill="#6b7f42" />
    <polygon points="170,205 195,265 180,250" fill="#4d5d28" />
    <polygon points="160,240 180,250 170,305 150,305" fill="#556832" />
    
    <!-- Right Arm & Front Chest -->
    <polygon points="310,215 265,215 240,265 285,265" fill="#8a9a5b" />
    <polygon points="285,265 310,215 320,250" fill="#6b7f42" />
    
    <!-- Central 'Y' Pillar & Legs -->
    <polygon points="215,265 265,265 265,340 215,340" fill="#556832" />
    <polygon points="215,265 240,340 215,340" fill="#3d4b1f" />
    <polygon points="240,265 265,265 265,340" fill="#6b7f42" />

    <!-- Unicorn Head & Horn (Matte Bone Titanium - Soft & Non-Metallic) -->
    <!-- Horn (Matte Chiseled Blade) -->
    <polygon points="310,135 365,75 320,130" fill="#e4e4e7" />
    <polygon points="320,130 365,75 330,125" fill="#cbd5e1" />

    <!-- Mane (Matte Facets) -->
    <polygon points="265,130 295,100 310,135 280,155" fill="#e4e4e7" />
    <polygon points="295,100 325,120 310,145" fill="#94a3b8" />
    <polygon points="280,155 310,145 330,170 290,185" fill="#cbd5e1" />

    <!-- Head & Muzzle -->
    <polygon points="310,145 355,160 360,195 325,200 305,175" fill="#f4f4f5" />
    <polygon points="325,200 360,195 350,215 320,210" fill="#71717a" />

    <!-- Neck & Chest Connection -->
    <polygon points="240,220 290,185 320,210 270,220" fill="#e4e4e7" />
    <polygon points="240,220 270,220 250,245" fill="#a1a1aa" />
    <polygon points="220,190 260,170 290,185 240,220" fill="#d4d4d8" />
  </g>

  <!-- Typography: Dark Mode (Crisp White + Olive Subtitle) -->
  <text x="250" y="415" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Arial Black', sans-serif" font-weight="900" font-size="46" letter-spacing="8" fill="#f4f4f5">
    YOONIKON
  </text>
  <text x="250" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', monospace" font-weight="700" font-size="12" letter-spacing="6" fill="#9bb068">
    TITANIUM // TACTICAL SUITE
  </text>
</svg>
