<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="cyanGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="softShadowLight" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Clean Enterprise Light Background -->
  <rect width="500" height="500" rx="80" fill="#ffffff" />
  <rect width="494" height="494" x="3" y="3" rx="77" fill="none" stroke="#e2e8f0" stroke-width="2" />

  <!-- Subtle Corner Pinstripes -->
  <line x1="45" y1="45" x2="105" y2="45" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  <line x1="45" y1="45" x2="45" y2="105" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  <line x1="455" y1="455" x2="395" y2="455" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  <line x1="455" y1="455" x2="455" y2="395" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

  <!-- Enterprise SyncLink Glyph: Dual Linked Screens -->
  <g transform="translate(0, -10)" filter="url(#softShadowLight)">
    <!-- Primary Display Screen (Left / Host) -->
    <rect x="130" y="145" width="160" height="110" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3" />
    <rect x="142" y="157" width="136" height="86" rx="8" fill="#e2e8f0" />
    <path d="M 210 255 L 210 280 M 185 280 L 235 280" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />

    <!-- Secondary Display Screen (Right / Client - Front) -->
    <rect x="210" y="200" width="160" height="110" rx="14" fill="#ffffff" stroke="url(#blueGradLight)" stroke-width="3.5" />
    <rect x="222" y="212" width="136" height="86" rx="8" fill="#eff6ff" />
    <path d="M 290 310 L 290 335 M 265 335 L 315 335" stroke="url(#blueGradLight)" stroke-width="4" stroke-linecap="round" />

    <!-- Connection / Sync Stream -->
    <path d="M 180 200 C 210 160, 240 260, 270 230" fill="none" stroke="url(#blueGradLight)" stroke-width="4" stroke-linecap="round" />
    <circle cx="180" cy="200" r="5" fill="#0284c7" />
    <circle cx="270" cy="230" r="5" fill="#2563eb" />

    <!-- Central Signal Badge -->
    <circle cx="225" cy="210" r="18" fill="#2563eb" />
    <path d="M 218 210 L 232 210 M 225 203 L 225 217" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Typography: Light Mode Professional Suite -->
  <text x="250" y="415" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-weight="800" font-size="44" letter-spacing="6" fill="#0f172a">
    SYNCLINK
  </text>
  <text x="250" y="446" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', monospace" font-weight="700" font-size="12" letter-spacing="5" fill="#2563eb">
    ENTERPRISE WORKSPACE
  </text>
</svg>
