<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="softShadowLight" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Matte Light Titanium Plate -->
  <rect width="500" height="500" rx="80" fill="#f5f6f2" />
  <rect width="494" height="494" x="3" y="3" rx="77" fill="none" stroke="#d4d9c7" stroke-width="2" />

  <!-- Tactical Corner Pinstripes -->
  <line x1="45" y1="45" x2="115" y2="45" stroke="#556832" stroke-width="3" stroke-linecap="round" />
  <line x1="45" y1="45" x2="45" y2="115" stroke="#556832" stroke-width="3" stroke-linecap="round" />
  <line x1="455" y1="455" x2="385" y2="455" stroke="#556832" stroke-width="3" stroke-linecap="round" />
  <line x1="455" y1="455" x2="455" y2="385" stroke="#556832" stroke-width="3" stroke-linecap="round" />

  <!-- Unicorn with 'Y' Integrated Body (Matte Finish) -->
  <g transform="translate(10, -5)" filter="url(#softShadowLight)">
    <!-- 'Y' Stem & Body (Tactical Olive Drab - Matte Crisp) -->
    <!-- Left Arm & Hindquarters -->
    <polygon points="170,205 215,205 240,265 195,265" fill="#6b7f42" />
    <polygon points="170,205 195,265 180,250" fill="#4d5d28" />
    <polygon points="160,240 180,250 170,305 150,305" fill="#556832" />
    
    <!-- Right Arm & Front Chest -->
    <polygon points="310,215 265,215 240,265 285,265" fill="#718646" />
    <polygon points="285,265 310,215 320,250" fill="#556832" />
    
    <!-- Central 'Y' Pillar & Legs -->
    <polygon points="215,265 265,265 265,340 215,340" fill="#556832" />
    <polygon points="215,265 240,340 215,340" fill="#3d4b1f" />
    <polygon points="240,265 265,265 265,340" fill="#6b7f42" />

    <!-- Unicorn Head & Horn (Matte Slate Facets - Crisp Contrast against Light Plate) -->
    <!-- Horn -->
    <polygon points="310,135 365,75 320,130" fill="#27272a" />
    <polygon points="320,130 365,75 330,125" fill="#3f3f46" />

    <!-- Mane -->
    <polygon points="265,130 295,100 310,135 280,155" fill="#3f3f46" />
    <polygon points="295,100 325,120 310,145" fill="#52525b" />
    <polygon points="280,155 310,145 330,170 290,185" fill="#27272a" />

    <!-- Head & Muzzle -->
    <polygon points="310,145 355,160 360,195 325,200 305,175" fill="#18181b" />
    <polygon points="325,200 360,195 350,215 320,210" fill="#3f3f46" />

    <!-- Neck & Chest Connection -->
    <polygon points="240,220 290,185 320,210 270,220" fill="#27272a" />
    <polygon points="240,220 270,220 250,245" fill="#52525b" />
    <polygon points="220,190 260,170 290,185 240,220" fill="#3f3f46" />
  </g>

  <!-- Typography: Light Mode (Deep Matte Charcoal/Black + Deep Olive Subtitle) -->
  <text x="250" y="415" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Arial Black', sans-serif" font-weight="900" font-size="46" letter-spacing="8" fill="#0f1113">
    YOONIKON
  </text>
  <text x="250" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', monospace" font-weight="700" font-size="12" letter-spacing="6" fill="#4b5e28">
    TITANIUM // TACTICAL SUITE
  </text>
</svg>
