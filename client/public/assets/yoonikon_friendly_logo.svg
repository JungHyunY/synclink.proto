<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Soft Warm Pastel Gradients -->
    <linearGradient id="bgSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="maneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>

    <linearGradient id="hornGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="500" rx="100" fill="url(#bgSoft)" />
  <rect width="496" height="496" x="2" y="2" rx="98" fill="none" stroke="#e0e7ff" stroke-width="2" />

  <!-- Friendly Yoonikon Mascot (Letter 'Y' + Friendly Unicorn) -->
  <g transform="translate(15, -10)" filter="url(#softShadow)">
    
    <!-- Magical Glowing Horn -->
    <path d="M 285,145 L 325,50 C 323,55 310,105 295,140 Z" fill="url(#hornGlow)" />
    <!-- Horn Swirls -->
    <path d="M 292,120 Q 305,110 315,95" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Fluffy Mane (Pastel Pink/Lavender) -->
    <path d="M 240,110 C 210,100 180,130 185,170 C 170,180 165,215 180,235 C 170,250 180,275 205,270 C 195,290 215,315 240,305 C 235,280 250,260 255,240 C 265,190 255,140 240,110 Z" fill="url(#maneGrad)" />

    <!-- Ear -->
    <path d="M 245,135 C 240,105 260,95 270,115 C 275,125 265,145 255,145 Z" fill="#bae6fd" />
    <path d="M 250,130 C 248,115 258,110 263,120 Z" fill="#f472b6" opacity="0.6" />

    <!-- 'Y' Shape Body & Cheerful Head -->
    <!-- The Stem and Head of 'Y' -->
    <path d="M 240,360 C 215,360 205,330 220,300 C 235,270 245,245 235,210 C 230,195 240,150 275,145 C 310,140 335,165 330,200 C 325,230 295,250 270,260 C 260,265 255,285 255,320 C 255,350 250,360 240,360 Z" fill="url(#bodyGrad)" />

    <!-- Cute Snout / Muzzle -->
    <ellipse cx="315" cy="195" rx="30" ry="24" fill="#f0f9ff" />
    <circle cx="320" cy="192" r="3" fill="#94a3b8" />

    <!-- Big Expressive Friendly Eye -->
    <circle cx="282" cy="172" r="11" fill="#0f172a" />
    <circle cx="285" cy="168" r="4.5" fill="#ffffff" />
    <circle cx="279" cy="175" r="2" fill="#ffffff" />

    <!-- Sweet Smiling Mouth -->
    <path d="M 302,205 Q 312,218 325,208" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />

    <!-- Rosy Cheek -->
    <ellipse cx="275" cy="190" rx="9" ry="6" fill="#fb7185" opacity="0.5" />

    <!-- Forelock Mane Swirl -->
    <path d="M 265,135 C 270,115 300,120 295,145 C 285,155 270,145 265,135 Z" fill="#f472b6" />
  </g>

  <!-- Typography: Yoonikon with Smile Curve -->
  <text x="250" y="425" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Nunito', 'Segoe UI', sans-serif" font-weight="900" font-size="52" letter-spacing="1" fill="#1e293b">
    Yoonikon
  </text>
  <!-- Smile Accent under brand name -->
  <path d="M 215,450 Q 250,470 285,450" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
</svg>
